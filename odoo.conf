[options]
; ── Database ──────────────────────────────────────────────────────────────────
; DB credentials are passed via HOST/PORT/USER/PASSWORD env vars by the
; official Odoo Docker entrypoint — no db_password needed here.
db_maxconn = 64
db_sslmode = prefer

; Route each subdomain to its own database:
;   mnl.yourdomain.com  → mnl_db
;   bioleaf.yourdomain.com → bioleaf_db
; %d = first component of the subdomain
dbfilter = ^%d_db$

; Disable database manager UI in production (re-enable temporarily to create DBs)
list_db = False

; ── Security ──────────────────────────────────────────────────────────────────
; admin_passwd is injected at container start by scripts/odoo-entrypoint.sh
; which reads $ODOO_MASTER_PASSWORD and writes it here.
; If you see this literal "REPLACE_AT_BOOT" in a running container, the entrypoint
; failed — the database manager is locked closed by Odoo's default (no master pw).
; NEVER commit a real master password to git. Generate with: openssl rand -base64 32
admin_passwd = REPLACE_AT_BOOT

; ── Reverse proxy ─────────────────────────────────────────────────────────────
; REQUIRED: Odoo must trust X-Forwarded-* headers from Traefik
proxy_mode = True

; ── Workers ───────────────────────────────────────────────────────────────────
; Sized to fit the 7 GB container memory cap in docker-compose.yml:
;   2 workers × 1.5 GB hard + 2 cron threads × 1.5 GB + ~1 GB overhead = 7 GB
; To raise: increase docker-compose deploy.resources.limits.memory PROPORTIONALLY.
; Formula: workers * limit_memory_hard + cron * limit_memory_hard + 1G < container_mem
workers = 2
max_cron_threads = 2

; Ports (Traefik connects internally; never expose these in docker-compose ports:)
http_port = 8069
; gevent_port replaces longpolling_port in Odoo 17+ (longpolling_port still works as alias)
gevent_port = 8072

; ── Data & addons ─────────────────────────────────────────────────────────────
data_dir = /var/lib/odoo

; Load order: official Odoo → OCA/third-party → custom
; Each OCA submodule dir must be listed separately
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/oca-account-financial-tools,/mnt/extra-addons/oca-account-financial-reporting,/mnt/extra-addons/oca-reporting-engine,/mnt/extra-addons/oca-server-ux,/mnt/custom-addons

; ── Memory limits per worker ──────────────────────────────────────────────────
limit_memory_soft = 671088640
limit_memory_hard = 1610612736

; ── Time limits ───────────────────────────────────────────────────────────────
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; ── Logging ───────────────────────────────────────────────────────────────────
; Omit logfile to log to stdout — captured by Docker json-file driver → Coolify UI
log_level = warning

; ── Email (configure per-company in Odoo UI) ──────────────────────────────────
; smtp_server = smtp.yourdomain.com
; smtp_port = 587
; smtp_ssl = starttls
; smtp_user = noreply@yourdomain.com
; smtp_password = your_smtp_password
